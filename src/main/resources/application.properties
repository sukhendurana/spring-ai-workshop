spring.application.name=spring-ai-workshop
# Base URL for OpenRouter (must point to the OpenAI-compatible API path)
spring.ai.openai.chat.base-url=https://openrouter.ai/api/v1

# OpenRouter identifier for the free Nemotron 3 Ultra model
spring.ai.openai.chat.options.model=nvidia/nemotron-3-ultra-550b-a55b:free

# Your OpenRouter API key
spring.ai.openai.api-key=test

# token control
spring.ai.openai.chat.options.max-tokens=2000

